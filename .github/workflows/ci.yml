name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --offline --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Set up PHP 8.4 reference (Linux)
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Compare with PHP 8.4 parse_str (Linux)
        if: runner.os == 'Linux'
        run: |
          php -v
          php -l tools/php_projection.php
          cargo build --offline --locked --bin urlencoded
          python3 tools/differential_urlencoded.py --rust-bin target/debug/urlencoded
