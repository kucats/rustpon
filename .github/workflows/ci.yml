name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --offline --locked --all-targets
      - name: Run Clippy
        run: cargo clippy --offline --locked --all-targets -- -D warnings
      - name: Fuzz workspace formatting (Linux)
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Compile and smoke-test fuzz targets (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --bins
          cargo test --manifest-path fuzz/Cargo.toml --lib
      - name: FFI formatting
        run: cargo fmt --manifest-path ffi/Cargo.toml -- --check
      - name: FFI Rust tests
        run: cargo test --manifest-path ffi/Cargo.toml --offline --all-targets
      - name: FFI Clippy
        run: cargo clippy --manifest-path ffi/Cargo.toml --offline --all-targets -- -D warnings
      - name: FFI C caller smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --manifest-path ffi/Cargo.toml --offline
          cc -std=c11 -Wall -Wextra -Werror -Iffi/include ffi/tests/abi_smoke.c -Lffi/target/debug -lrustpon_ffi -Wl,-rpath,"$PWD/ffi/target/debug" -o ffi/target/abi-smoke
          ffi/target/abi-smoke
          cc -std=c11 -Wall -Wextra -Werror -Iffi/include ffi/tests/scope_smoke.c -Lffi/target/debug -lrustpon_ffi -Wl,-rpath,"$PWD/ffi/target/debug" -o ffi/target/scope-smoke
          ffi/target/scope-smoke
      - name: Set up PHP 8.4 reference (Linux)
        if: runner.os == 'Linux'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: none
      - name: Build and smoke-test PHP 8.4 RINIT/RSHUTDOWN extension (Linux)
        if: runner.os == 'Linux'
        run: |
          phpize -v
          php-config --version
          cd ffi/php_probe
          phpize
          ./configure --enable-rustpon-probe
          make -j2
          cd ../..
          python3 tools/php_probe_lifecycle.py --module ffi/php_probe/modules/rustpon_probe.so --library ffi/target/debug/librustpon_ffi.so
      - name: Compare bounded PHP integer evaluator with PHP CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --offline --locked --bin php_eval
          python3 tools/differential_php_eval.py --rust-bin target/debug/php_eval
      - name: Compare with PHP 8.4 parse_str (Linux)
        if: runner.os == 'Linux'
        run: |
          php -v
          php -l tools/php_projection.php
          cargo build --offline --locked --bin urlencoded
          python3 tools/differential_urlencoded.py --rust-bin target/debug/urlencoded
      - name: Compare real FFI ABI with PHP 8.4 parse_str (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 tools/differential_ffi.py --library ffi/target/debug/librustpon_ffi.so
      - name: Compare multipart FFI with real PHP 8.4 SAPI (Linux)
        if: runner.os == 'Linux'
        run: |
          python3 tools/differential_multipart_ffi.py --library ffi/target/debug/librustpon_ffi.so
      - name: Compare with PHP 8.4 multipart SAPI (Linux)
        if: runner.os == 'Linux'
        run: |
          php -l tools/multipart_projection.php
          cargo build --offline --locked --bin multipart
          python3 tools/differential_multipart.py --rust-bin target/debug/multipart
